[package]
name = "rustgrok"
version = "0.1.0"
edition = "2021"
license = "MIT AND CDDL-1.0"
publish = false

[dependencies]
rustgrok-path-index = { path = "../../crates/path-index" }
serde_json = "=1.0.140"
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.176"

[features]
test-hooks = ["rustgrok-path-index/fault-injection"]
